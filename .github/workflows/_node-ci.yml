name: Node.js CI (Reusable)

on:
  workflow_call:
    inputs:
      workspace:
        description: 'Workspace name (e.g., inventory-api)'
        required: true
        type: string
      run_coverage:
        description: 'Run tests with coverage'
        required: false
        type: boolean
        default: false

jobs:
  node-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace ${{ inputs.workspace }} --if-present || npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        if: inputs.run_coverage != true
        run: npm run test --workspace ${{ inputs.workspace }} --if-present || npm run test:unit

      - name: Unit tests with coverage
        if: inputs.run_coverage == true
        run: npm run test --workspace ${{ inputs.workspace }} --if-present -- --coverage --runInBand || npm run test:coverage

      - name: Upload coverage
        if: inputs.run_coverage == true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.workspace }}
          path: |
            ${{ inputs.workspace }}/coverage/
            coverage/
          retention-days: 30
          if-no-files-found: ignore
