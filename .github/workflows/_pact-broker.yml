name: Pact Broker (Reusable)

on:
  workflow_call:
    inputs:
      action:
        description: 'Action to perform: start, stop, or health'
        required: true
        type: string
        default: 'start'

jobs:
  broker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Pact Broker
        if: inputs.action == 'start'
        run: docker compose up -d

      - name: Wait for Pact Broker
        if: inputs.action == 'start'
        run: |
          timeout 30 bash -c 'until curl -f -u pact:pact http://localhost:9292 || curl -f http://localhost:9292; do sleep 2; done'

      - name: Health check Pact Broker
        if: inputs.action == 'health'
        run: |
          if curl -f -u pact:pact http://localhost:9292/health || curl -f http://localhost:9292/health; then
            echo "broker_ready=true" >> $GITHUB_OUTPUT
          else
            echo "broker_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop Pact Broker
        if: inputs.action == 'stop'
        run: docker compose down
