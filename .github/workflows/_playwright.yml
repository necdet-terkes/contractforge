name: Playwright E2E (Reusable)

on:
  workflow_call:
    inputs:
      project:
        description: 'Playwright project to run (mock-mode, real-mode, or all)'
        required: true
        type: string
        default: 'mock-mode'
      mock_mode:
        description: 'Enable mock mode'
        required: false
        type: boolean
        default: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium)
        working-directory: ui-app
        run: npx playwright install --with-deps chromium

      - name: Verify mocks are running (mock mode only)
        if: inputs.mock_mode == true
        run: |
          # Check if mock servers are running on expected ports
          MOCKS_RUNNING=true
          for port in 5001 5002 5003; do
            if ! curl -f http://localhost:$port >/dev/null 2>&1; then
              MOCKS_RUNNING=false
              echo "❌ Mock server not responding on port $port"
            fi
          done
          if [ "$MOCKS_RUNNING" = "false" ]; then
            echo "❌ Mock servers are not running. Cannot run Playwright tests in mock mode."
            echo "This usually means mocks failed to start or were not generated."
            exit 1
          else
            echo "✓ All mock servers are running and responding"
          fi

      - name: Run Playwright tests
        working-directory: ui-app
        run: |
          if [ "${{ inputs.project }}" == "all" ]; then
            npx playwright test
          else
            npx playwright test --project=${{ inputs.project }}
          fi
        env:
          MOCK_MODE: ${{ inputs.mock_mode && 'true' || 'false' }}
          VITE_MOCK_MODE: ${{ inputs.mock_mode && 'true' || 'false' }}

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.project }}
          path: ui-app/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ inputs.project }}
          path: ui-app/test-results/
          retention-days: 7
          if-no-files-found: ignore
