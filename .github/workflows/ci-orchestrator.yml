name: CI - Orchestrator API

on:
  pull_request:
    paths:
      - 'orchestrator-api/**'
      - 'tools/**'
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.eslintrc*'
  push:
    branches:
      - main
    paths:
      - 'orchestrator-api/**'
      - 'tools/**'
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.eslintrc*'
  workflow_dispatch: {}

jobs:
  node-ci:
    uses: ./.github/workflows/_node-ci.yml
    with:
      workspace: 'orchestrator-api'
      run_coverage: true
    secrets: inherit

  broker-check:
    needs: node-ci
    uses: ./.github/workflows/_pact-broker-check.yml
    secrets: inherit

  pact-consumer:
    needs: [node-ci, broker-check]
    if: ${{ needs.broker-check.outputs.broker_ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Pact consumer tests and publish
        run: npm run pact:consumer:all --workspace orchestrator-api
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_CONSUMER_VERSION: ${{ github.sha }}
          PACT_CONSUMER_BRANCH: ${{ github.ref_name }}

      - name: Upload pact contracts as artifact
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-pacts
          path: orchestrator-api/pacts/*.json
          if-no-files-found: warn
          retention-days: 7
