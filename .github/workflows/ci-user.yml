name: CI - User API

on:
  pull_request:
    paths:
      - 'user-api/**'
      - 'tools/**'
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.eslintrc*'
  push:
    branches:
      - main
    paths:
      - 'user-api/**'
      - 'tools/**'
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.eslintrc*'
  workflow_dispatch: {}

jobs:
  node-ci:
    uses: ./.github/workflows/_node-ci.yml
    with:
      workspace: 'user-api'
      run_coverage: true
    secrets: inherit

  broker-check:
    needs: node-ci
    uses: ./.github/workflows/_pact-broker-check.yml
    secrets: inherit

  pact-verify:
    needs: [node-ci, broker-check]
    if: ${{ needs.broker-check.outputs.broker_ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify provider contracts (user-api)
        run: npm run pact:verify --workspace user-api
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_PROVIDER_VERSION: ${{ github.sha }}
          PACT_PROVIDER_BRANCH: ${{ github.ref_name }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-user-api
          path: |
            user-api/coverage/
            coverage/
          retention-days: 7
          if-no-files-found: ignore
