name: Integration CI

on:
  pull_request:
    paths:
      - 'orchestrator-api/**'
      - 'inventory-api/**'
      - 'user-api/**'
      - 'pricing-api/**'
      - 'ui-app/**'
      - 'tools/mockoon/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'orchestrator-api/**'
      - 'inventory-api/**'
      - 'user-api/**'
      - 'pricing-api/**'
      - 'ui-app/**'
      - 'tools/mockoon/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all
        run: npm run typecheck

      - name: Lint all
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

  pact-flow:
    needs: integration
    # In real-world: Broker is persistent and shared across all teams
    # In POC: Broker runs as service container (persistent within job)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pact_broker
          POSTGRES_PASSWORD: pact_broker
          POSTGRES_DB: pact_broker
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      pact-broker:
        image: pactfoundation/pact-broker:latest
        env:
          PACT_BROKER_DATABASE_URL: postgres://pact_broker:pact_broker@postgres/pact_broker
          PACT_BROKER_LOG_LEVEL: INFO
          PACT_BROKER_BASIC_AUTH_USERNAME: pact
          PACT_BROKER_BASIC_AUTH_PASSWORD: pact
        ports:
          - 9292:9292
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Pact Broker
        run: |
          timeout 30 bash -c 'until curl -f -u pact:pact http://localhost:9292 || curl -f http://localhost:9292; do sleep 2; done'

      - name: Run Pact consumer tests and publish
        # Step 1: Consumer (orchestrator) runs tests and publishes contracts to broker
        # In real-world: This happens in orchestrator's CI, publishes to shared persistent broker
        # In POC: Broker runs as service container (persistent within this job)
        run: npm run pact:consumer:all --workspace orchestrator-api
        env:
          PACT_BROKER_BASE_URL: http://localhost:9292
          PACT_BROKER_USERNAME: pact
          PACT_BROKER_PASSWORD: pact
          PACT_CONSUMER_VERSION: ${{ github.sha }}
          PACT_CONSUMER_BRANCH: ${{ github.ref_name }}

      - name: Verify all provider contracts
        # Step 2: Providers verify against latest consumer contracts from broker
        # In real-world: Each provider CI independently verifies against broker
        # If verification fails, provider cannot merge (contract broken)
        # In POC: Broker runs as service container, contains contracts from step 1
        run: npm run pact:verify
        env:
          PACT_BROKER_BASE_URL: http://localhost:9292
          PACT_BROKER_USERNAME: pact
          PACT_BROKER_PASSWORD: pact
          PACT_PROVIDER_VERSION: ${{ github.sha }}
          PACT_PROVIDER_BRANCH: ${{ github.ref_name }}

  generate-mocks:
    needs: pact-flow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pull pacts from broker
        # Step 3a: Pull latest contracts from broker
        # In real-world: Mock generation service pulls from persistent broker
        run: npm run pacts:pull
        env:
          PACT_BROKER_BASE_URL: http://localhost:9292
          PACT_BROKER_USERNAME: pact
          PACT_BROKER_PASSWORD: pact

      - name: Generate Mockoon mocks from Pact contracts
        # Step 3b: Generate mocks from contracts
        # In real-world: Mocks are regenerated when contracts change
        # UI and other services depend on these mocks
        run: npm run mocks:generate

      - name: Upload pact contracts as artifact
        # Step 3c: Upload contracts so other CI pipelines can use them
        # In real-world: Contracts are in shared persistent broker
        # In POC: Contracts are shared via artifacts (simulates shared broker)
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: |
            tools/mockoon/pacts/*.json
            orchestrator-api/pacts/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload generated mocks as artifact
        # Step 3d: Upload mocks so UI CI and other services can use them
        # In real-world: Mocks are in shared mock server
        # In POC: Mocks are shared via artifacts (simulates shared mock server)
        uses: actions/upload-artifact@v4
        with:
          name: mockoon-mocks
          path: tools/mockoon/generated/*.json
          retention-days: 7
          if-no-files-found: ignore

  start-mocks:
    needs: generate-mocks
    uses: ./.github/workflows/_mockoon.yml
    with:
      action: 'start'
      broker_url: http://localhost:9292
      broker_username: pact
      broker_password: pact

  playwright-mock:
    needs: start-mocks
    uses: ./.github/workflows/_playwright.yml
    with:
      project: 'mock-mode'
      mock_mode: true

  stop-mocks:
    needs: [playwright-mock]
    if: always()
    uses: ./.github/workflows/_mockoon.yml
    with:
      action: 'stop'

  start-real-apis:
    needs: stop-mocks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start real APIs for CRUD tests
        run: |
          npm run dev:inventory > /tmp/inventory-api.log 2>&1 &
          echo $! > /tmp/inventory-api.pid
          npm run dev:user > /tmp/user-api.log 2>&1 &
          echo $! > /tmp/user-api.pid
          npm run dev:pricing > /tmp/pricing-api.log 2>&1 &
          echo $! > /tmp/pricing-api.pid
          sleep 3

      - name: Wait for real APIs to be ready
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:4001/products && curl -f http://localhost:4002/users && curl -f http://localhost:4003/pricing/rules; do sleep 2; done'

  playwright-real:
    needs: start-real-apis
    uses: ./.github/workflows/_playwright.yml
    with:
      project: 'real-mode'
      mock_mode: false

  cleanup:
    needs: [integration, playwright-real]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stop real APIs
        run: |
          # Kill processes by port since PID files may not be accessible across jobs
          # Find processes listening on API ports and kill them
          # Try lsof first, fallback to ss/netstat if lsof is not available
          for port in 4001 4002 4003; do
            # Try lsof (common on Ubuntu)
            PID=$(lsof -ti:$port 2>/dev/null || true)
            if [ -z "$PID" ]; then
              # Fallback to ss (modern alternative)
              PID=$(ss -ltnp 2>/dev/null | grep ":$port " | awk '{print $6}' | cut -d',' -f2 | cut -d'=' -f2 | head -1 || true)
            fi
            if [ -z "$PID" ]; then
              # Fallback to netstat (older systems)
              PID=$(netstat -ltnp 2>/dev/null | grep ":$port " | awk '{print $7}' | cut -d'/' -f1 | head -1 || true)
            fi
            if [ -n "$PID" ] && [ "$PID" != "-" ]; then
              echo "Stopping process on port $port (PID: $PID)"
              kill $PID 2>/dev/null || true
            fi
          done
          # Also try PID files as fallback (for same-job cleanup)
          if [ -f /tmp/inventory-api.pid ]; then kill $(cat /tmp/inventory-api.pid) 2>/dev/null || true; fi
          if [ -f /tmp/user-api.pid ]; then kill $(cat /tmp/user-api.pid) 2>/dev/null || true; fi
          if [ -f /tmp/pricing-api.pid ]; then kill $(cat /tmp/pricing-api.pid) 2>/dev/null || true; fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
            orchestrator-api/coverage/
            inventory-api/coverage/
            user-api/coverage/
            pricing-api/coverage/
          retention-days: 30
          if-no-files-found: ignore
