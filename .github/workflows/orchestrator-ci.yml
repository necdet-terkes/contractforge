name: Orchestrator API CI

on:
  pull_request:
    paths:
      - 'orchestrator-api/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.eslintrc*'
      - 'jest.base.config.ts'
      - 'tools/**'
  push:
    branches:
      - main
    paths:
      - 'orchestrator-api/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.eslintrc*'
      - 'jest.base.config.ts'
      - 'tools/**'

jobs:
  pact-flow:
    # Wait for pact-flow workflow to complete successfully
    # This ensures contracts are verified and mocks are generated
    uses: ./.github/workflows/pact-flow.yml

  orchestrator-tests:
    needs: pact-flow
    # Unit and integration tests for orchestrator-api
    uses: ./.github/workflows/_node-ci.yml
    with:
      workspace: 'orchestrator-api'
      run_coverage: true
    secrets: inherit
