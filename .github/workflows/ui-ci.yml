name: UI App CI

on:
  pull_request:
    paths:
      - 'ui-app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.eslintrc*'
  push:
    branches:
      - main
    paths:
      - 'ui-app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.eslintrc*'

jobs:
  node-ci:
    uses: ./.github/workflows/_node-ci.yml
    with:
      workspace: 'ui-app'
      run_coverage: false
    secrets: inherit

  generate-mocks:
    needs: node-ci
    runs-on: ubuntu-latest
    outputs:
      mocks_generated: ${{ steps.generate.outputs.mocks_generated }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate mocks from local pacts
        id: generate
        # For PRs, use local pacts if available; otherwise integration-ci will handle broker-based mocks
        run: |
          if [ -d "orchestrator-api/pacts" ] && [ "$(ls -A orchestrator-api/pacts/*.json 2>/dev/null)" ]; then
            npm run mocks:generate
            echo "mocks_generated=true" >> $GITHUB_OUTPUT
            echo "✓ Mocks generated from local pacts"
          else
            echo "mocks_generated=false" >> $GITHUB_OUTPUT
            echo "No local pacts found. Skipping mock generation. Integration CI will handle this."
          fi

      - name: Verify mock files were generated
        if: steps.generate.outputs.mocks_generated == 'true'
        # Only verify if we attempted to generate mocks
        run: |
          if [ ! -f "tools/mockoon/generated/inventory-api.json" ] || \
             [ ! -f "tools/mockoon/generated/user-api.json" ] || \
             [ ! -f "tools/mockoon/generated/pricing-api.json" ]; then
            echo "❌ Mock files were not generated. Cannot run Playwright tests in mock mode."
            echo "This usually means mock generation failed."
            exit 1
          else
            echo "✓ Mock files verified: all required mocks exist"
          fi

  start-mocks:
    needs: generate-mocks
    if: ${{ needs.generate-mocks.outputs.mocks_generated == 'true' }}
    uses: ./.github/workflows/_mockoon.yml
    with:
      action: 'start'

  playwright-mock:
    needs: [generate-mocks, start-mocks]
    if: ${{ needs.generate-mocks.outputs.mocks_generated == 'true' }}
    uses: ./.github/workflows/_playwright.yml
    with:
      project: 'mock-mode'
      mock_mode: true

  stop-mocks:
    needs: [generate-mocks, playwright-mock]
    if: ${{ always() && needs.generate-mocks.outputs.mocks_generated == 'true' }}
    uses: ./.github/workflows/_mockoon.yml
    with:
      action: 'stop'
