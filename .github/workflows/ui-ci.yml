name: UI App CI

on:
  pull_request:
    paths:
      - 'ui-app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.eslintrc*'
  push:
    branches:
      - main
    paths:
      - 'ui-app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.eslintrc*'

jobs:
  pact-flow:
    # Wait for pact-flow workflow to complete successfully
    # This ensures contracts are verified and mocks are generated
    uses: ./.github/workflows/pact-flow.yml

  ui-tests:
    needs: pact-flow
    # Unit tests for ui-app
    uses: ./.github/workflows/_node-ci.yml
    with:
      workspace: 'ui-app'
      run_coverage: false
    secrets: inherit

  download-mocks:
    needs: pact-flow
    # Download mocks from pact-flow workflow
    # In real-world: Mocks are in shared mock server
    # In POC: Mocks are shared via artifacts from pact-flow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mockoon mocks from pact-flow
        uses: actions/download-artifact@v4
        with:
          name: mockoon-mocks
          path: tools/mockoon/generated
          if-no-files-found: error
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify mocks are available
        run: |
          if [ ! -f "tools/mockoon/generated/inventory-api.json" ] || \
             [ ! -f "tools/mockoon/generated/user-api.json" ] || \
             [ ! -f "tools/mockoon/generated/pricing-api.json" ]; then
            echo "❌ Mock files are missing. Cannot run Playwright tests in mock mode."
            exit 1
          else
            echo "✓ Mock files verified: all required mocks exist"
          fi

  start-mocks:
    needs: download-mocks
    uses: ./.github/workflows/_mockoon.yml
    with:
      action: 'start'

  playwright-mock:
    needs: start-mocks
    uses: ./.github/workflows/_playwright.yml
    with:
      project: 'mock-mode'
      mock_mode: true

  stop-mocks:
    needs: [playwright-mock]
    if: always()
    uses: ./.github/workflows/_mockoon.yml
    with:
      action: 'stop'
